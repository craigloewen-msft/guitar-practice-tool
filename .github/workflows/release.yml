name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: cargo packager --release --target ${{ matrix.target }} -f ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            target/dist/*.deb
            target/dist/*.AppImage
            target/dist/*-setup.exe
            target/dist/*.dmg
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
